[package]
name = "cabin-euchre"
version = "0.1.0"
edition = "2024"
# The `if let` match guard in app.rs. 1.92 can't build it; 1.95 is the oldest checked.
rust-version = "1.95"
description = "Cabin Euchre: euchre on a lamp-lit cabin table, with juicy pixel-art card-game feel."
publish = false

[package.metadata.love2drs]
# Android and iOS builds: `cargo love2drs android run -p cabin-euchre`.
app_id = "com.gccody.cabineuchre"
name = "Cabin Euchre"
orientation = "landscape"
assets = ["assets/music/theme.ogg"]
icon = "assets/icon.png"
permissions = ["android.permission.INTERNET"]

[workspace]
members = [".", "core"]
default-members = [".", "core"]
# `server/` (the Cloudflare Worker) is its own workspace: it only builds for wasm.
exclude = ["server"]

[dependencies]
love2drs = { git = "https://github.com/gccody/Love2DRS" }
euchre-core = { path = "core" }
serde_json = "1"
# Online play: a blocking WebSocket client on a background thread, TLS via
# rustls with the `ring` provider (pure Rust plus a little C/asm: builds for
# Windows, macOS, Linux, Android and iOS without system OpenSSL).
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Steam builds only (`cargo build --features steam`): names, invites, rich presence.
steamworks = { version = "0.13", optional = true }

[features]
steam = ["dep:steamworks"]

# Bug proofs that open real windows (see the file). Not part of a plain `cargo test`:
# run them with `cargo test --test scene_bugs`.
[[test]]
name = "scene_bugs"
path = "tests/scene_bugs.rs"
harness = false
test = false

# Puts the icon and the name into the Windows .exe (see build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# To develop against a local checkout of the framework instead, uncomment:
# [patch."https://github.com/gccody/Love2DRS"]
# love2drs = { path = "C:/Users/gccody/.t3/projects/love2drs" }

# Optimize dependencies (wgpu, image decoding, audio) even in debug builds so
# `cargo run` stays smooth. Our own crate still compiles fast.
[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
