[package]
name = "euchre"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Euchre on a lamp-lit cabin table, with juicy pixel-art card-game feel."
publish = false

[workspace]
members = [".", "core"]
default-members = [".", "core"]
# `server/` (the Cloudflare Worker) is its own workspace: it only builds for wasm.
exclude = ["server"]

[dependencies]
love2drs = { git = "https://github.com/gccody/Love2DRS" }
euchre-core = { path = "core" }

# To develop against a local checkout of the framework instead, uncomment:
# [patch."https://github.com/gccody/Love2DRS"]
# love2drs = { path = "C:/Users/gccody/.t3/projects/love2drs" }

# Optimize dependencies (wgpu, image decoding, audio) even in debug builds so
# `cargo run` stays smooth. Our own crate still compiles fast.
[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
