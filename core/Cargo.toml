[package]
name = "euchre-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Euchre rules, AI, saves and the online room protocol. No framework or I/O code, so it builds for the game and for the Cloudflare server (wasm)."
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# For `examples/netcheck.rs`, which plays a game against a running server.
tungstenite = "0.30"

# Proofs of known bugs, which fail until those are fixed:
# run them with `cargo test -p euchre-core --test bug_proofs`.
[[test]]
name = "bug_proofs"
path = "tests/bug_proofs.rs"
test = false
