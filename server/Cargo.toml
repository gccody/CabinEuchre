[package]
name = "euchre-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "The online room server: a Cloudflare Worker with one Durable Object per table."
publish = false

# Built for wasm by `worker-build` (wrangler runs it); not part of the game's workspace.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
euchre-core = { path = "../core" }
worker = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
