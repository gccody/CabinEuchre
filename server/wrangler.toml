name = "euchre"
main = "build/index.js"
compatibility_date = "2026-10-01"

[build]
command = "worker-build --release"

# One Durable Object per table, addressed by its room code. SQLite-backed
# objects are the kind the Workers Free plan allows.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "EuchreRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["EuchreRoom"]

# New connections per address, per minute (see `allowed` in src/lib.rs). Cloudflare counts
# approximately, so this stops heavy bursts rather than holding to exactly this number.
[[ratelimits]]
name = "CONNECTS"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[observability]
enabled = true
